<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウーパールーパーVR水槽</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #2A86A3" fog="type: linear; color: #2A86A3; near: 2; far: 14">

    <!-- 光 -->
    <a-entity light="type: ambient; color: #BFE8F5; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; color: #FFFFFF; intensity: 0.9" position="2 8 3"></a-entity>

    <!-- 砂の床 -->
    <a-plane rotation="-90 0 0" width="60" height="60" color="#E3D3A0"></a-plane>

    <!-- ===== ウーパールーパー ===== -->

    <!-- ===== ① リューシスティック：体 白 / 目 黒 / 鰓 ピンク ===== -->
    <!-- 親：原点（自分の位置）を中心にぐるっと回す -->
    <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 30000; easing: linear; loop: true">
      <!-- 子：自分から距離2.8の位置に置く -->
      <a-entity position="0 0.5 -1.8" rotation="0 180 0"
        animation="property: position; from: 0 0.40 -1.8; to: 0 0.60 -1.8; dur: 2000; dir: alternate; easing: easeInOutSine; loop: true">
        <a-entity scale="0.25 0.25 0.25">
          <a-entity position="1.05 0 0">

            <!-- 胴体 -->
            <a-entity position="-0.2 0.65 0" scale="1.35 0.35 0.65">
              <a-sphere radius="1" color="#FFFFFF"></a-sphere>
            </a-entity>

            <!-- 頭 -->
            <a-entity position="1.0 0.95 0" scale="0.8 0.55 0.7">
              <a-sphere radius="1" color="#FFFFFF"></a-sphere>
            </a-entity>

            <!-- 目 -->
            <a-sphere position="1.35 1.15 0.5" radius="0.1" color="#000000"></a-sphere>
            <a-sphere position="1.35 1.15 -0.5" radius="0.1" color="#000000"></a-sphere>

            <!-- 口 -->
            <a-box position="1.75 0.9 0" width="0.085" height="0.025" depth="0.4" color="#E58AA0"></a-box>

            <!-- 外鰓（手前側） -->
            <a-cone position="0.95 1.30 0.8" rotation="63 0 0" radius-bottom="0.13" height="0.55" color="#FF8FB1"></a-cone>
            <a-cone position="0.95 0.95 0.85" rotation="90 0 0" radius-bottom="0.13" height="0.55" color="#FF8FB1"></a-cone>
            <a-cone position="0.95 0.65 0.78" rotation="109 0 0" radius-bottom="0.13" height="0.55" color="#FF8FB1"></a-cone>

            <!-- 外鰓（反対側） -->
            <a-cone position="0.95 1.30 -0.8" rotation="-63 0 0" radius-bottom="0.13" height="0.55" color="#FF8FB1"></a-cone>
            <a-cone position="0.95 0.95 -0.85" rotation="-90 0 0" radius-bottom="0.13" height="0.55" color="#FF8FB1"></a-cone>
            <a-cone position="0.95 0.65 -0.78" rotation="-109 0 0" radius-bottom="0.13" height="0.55" color="#FF8FB1"></a-cone>

            <!-- 足 -->
            <a-cylinder position="0.65 0.3 0.55" rotation="-34 0 0" radius="0.12" height="0.5" color="#FFFFFF"></a-cylinder>
            <a-cylinder position="0.65 0.3 -0.55" rotation="34 0 0" radius="0.12" height="0.5" color="#FFFFFF"></a-cylinder>
            <a-cylinder position="-0.85 0.3 0.55" rotation="-34 0 0" radius="0.12" height="0.5" color="#FFFFFF"></a-cylinder>
            <a-cylinder position="-0.85 0.3 -0.55" rotation="34 0 0" radius="0.12" height="0.5" color="#FFFFFF"></a-cylinder>

            <!-- しっぽ -->
            <a-entity position="-1.2 0.8 0"
              animation="property: rotation; from: 0 -7 0; to: 0 7 0; dur: 700; dir: alternate; easing: easeInOutSine; loop: true">
              <a-entity position="-0.2 0 0" scale="2.5 0.3 0.2">
                <a-sphere radius="1" color="#FFFFFF"></a-sphere>
              </a-entity>
            </a-entity>

          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ===== ② ゴールデン：体 黄色 / 目 白 / 鰓 オレンジがかったピンク ===== -->
    <!-- 親：原点（自分の位置）を中心にぐるっと回す -->
    <a-entity animation="property: rotation; from: 0 120 0; to: 0 -240 0; dur: 40000; easing: linear; loop: true">
      <!-- 子：自分から距離3.7の位置に置く -->
      <a-entity position="0 0.8 -2.4" rotation="0 0 0"
        animation="property: position; from: 0 0.70 -2.4; to: 0 0.90 -2.4; dur: 2400; dir: alternate; easing: easeInOutSine; loop: true">
        <a-entity scale="0.25 0.25 0.25">
          <a-entity position="1.05 0 0">

            <!-- 胴体 -->
            <a-entity position="-0.2 0.65 0" scale="1.35 0.35 0.65">
              <a-sphere radius="1" color="#FFD54A"></a-sphere>
            </a-entity>

            <!-- 頭 -->
            <a-entity position="1.0 0.95 0" scale="0.8 0.55 0.7">
              <a-sphere radius="1" color="#FFE066"></a-sphere>
            </a-entity>

            <!-- 目 -->
            <a-sphere position="1.35 1.15 0.5" radius="0.1" color="#FFFFFF"></a-sphere>
            <a-sphere position="1.35 1.15 -0.5" radius="0.1" color="#FFFFFF"></a-sphere>

            <!-- 口 -->
            <a-box position="1.75 0.9 0" width="0.085" height="0.025" depth="0.4" color="#E0A030"></a-box>

            <!-- 外鰓（手前側） -->
            <a-cone position="0.95 1.30 0.8" rotation="63 0 0" radius-bottom="0.13" height="0.55" color="#FF9F7A"></a-cone>
            <a-cone position="0.95 0.95 0.85" rotation="90 0 0" radius-bottom="0.13" height="0.55" color="#FF9F7A"></a-cone>
            <a-cone position="0.95 0.65 0.78" rotation="109 0 0" radius-bottom="0.13" height="0.55" color="#FF9F7A"></a-cone>

            <!-- 外鰓（反対側） -->
            <a-cone position="0.95 1.30 -0.8" rotation="-63 0 0" radius-bottom="0.13" height="0.55" color="#FF9F7A"></a-cone>
            <a-cone position="0.95 0.95 -0.85" rotation="-90 0 0" radius-bottom="0.13" height="0.55" color="#FF9F7A"></a-cone>
            <a-cone position="0.95 0.65 -0.78" rotation="-109 0 0" radius-bottom="0.13" height="0.55" color="#FF9F7A"></a-cone>

            <!-- 足 -->
            <a-cylinder position="0.65 0.3 0.55" rotation="-34 0 0" radius="0.12" height="0.5" color="#FFCF40"></a-cylinder>
            <a-cylinder position="0.65 0.3 -0.55" rotation="34 0 0" radius="0.12" height="0.5" color="#FFCF40"></a-cylinder>
            <a-cylinder position="-0.85 0.3 0.55" rotation="-34 0 0" radius="0.12" height="0.5" color="#FFCF40"></a-cylinder>
            <a-cylinder position="-0.85 0.3 -0.55" rotation="34 0 0" radius="0.12" height="0.5" color="#FFCF40"></a-cylinder>

            <!-- しっぽ -->
            <a-entity position="-1.2 0.8 0"
              animation="property: rotation; from: 0 -7 0; to: 0 7 0; dur: 800; dir: alternate; easing: easeInOutSine; loop: true">
              <a-entity position="-0.2 0 0" scale="2.5 0.3 0.2">
                <a-sphere radius="1" color="#FFD54A"></a-sphere>
              </a-entity>
            </a-entity>

          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ===== ③ ブラック：体 グレー / 目 青みがかった黒 / 鰓 グレー ===== -->
    <!-- 親：原点（自分の位置）を中心にぐるっと回す -->
    <a-entity animation="property: rotation; from: 0 240 0; to: 0 600 0; dur: 50000; easing: linear; loop: true">
      <!-- 子：自分から距離4.5の位置に置く -->
      <a-entity position="0 0.4 -3.0" rotation="0 180 0"
        animation="property: position; from: 0 0.30 -3.0; to: 0 0.50 -3.0; dur: 2800; dir: alternate; easing: easeInOutSine; loop: true">
        <a-entity scale="0.25 0.25 0.25">
          <a-entity position="1.05 0 0">

            <!-- 胴体 -->
            <a-entity position="-0.2 0.65 0" scale="1.35 0.35 0.65">
              <a-sphere radius="1" color="#4A4A50"></a-sphere>
            </a-entity>

            <!-- 頭 -->
            <a-entity position="1.0 0.95 0" scale="0.8 0.55 0.7">
              <a-sphere radius="1" color="#55555B"></a-sphere>
            </a-entity>

            <!-- 目 -->
            <a-sphere position="1.35 1.15 0.5" radius="0.1" color="#101A3A"></a-sphere>
            <a-sphere position="1.35 1.15 -0.5" radius="0.1" color="#101A3A"></a-sphere>

            <!-- 口 -->
            <a-box position="1.75 0.9 0" width="0.085" height="0.025" depth="0.4" color="#2A2A2E"></a-box>

            <!-- 外鰓（手前側） -->
            <a-cone position="0.95 1.30 0.8" rotation="63 0 0" radius-bottom="0.13" height="0.55" color="#3A3A40"></a-cone>
            <a-cone position="0.95 0.95 0.85" rotation="90 0 0" radius-bottom="0.13" height="0.55" color="#3A3A40"></a-cone>
            <a-cone position="0.95 0.65 0.78" rotation="109 0 0" radius-bottom="0.13" height="0.55" color="#3A3A40"></a-cone>

            <!-- 外鰓（反対側） -->
            <a-cone position="0.95 1.30 -0.8" rotation="-63 0 0" radius-bottom="0.13" height="0.55" color="#3A3A40"></a-cone>
            <a-cone position="0.95 0.95 -0.85" rotation="-90 0 0" radius-bottom="0.13" height="0.55" color="#3A3A40"></a-cone>
            <a-cone position="0.95 0.65 -0.78" rotation="-109 0 0" radius-bottom="0.13" height="0.55" color="#3A3A40"></a-cone>

            <!-- 足 -->
            <a-cylinder position="0.65 0.3 0.55" rotation="-34 0 0" radius="0.12" height="0.5" color="#4A4A50"></a-cylinder>
            <a-cylinder position="0.65 0.3 -0.55" rotation="34 0 0" radius="0.12" height="0.5" color="#4A4A50"></a-cylinder>
            <a-cylinder position="-0.85 0.3 0.55" rotation="-34 0 0" radius="0.12" height="0.5" color="#4A4A50"></a-cylinder>
            <a-cylinder position="-0.85 0.3 -0.55" rotation="34 0 0" radius="0.12" height="0.5" color="#4A4A50"></a-cylinder>

            <!-- しっぽ -->
            <a-entity position="-1.2 0.8 0"
              animation="property: rotation; from: 0 -7 0; to: 0 7 0; dur: 900; dir: alternate; easing: easeInOutSine; loop: true">
              <a-entity position="-0.2 0 0" scale="2.5 0.3 0.2">
                <a-sphere radius="1" color="#4A4A50"></a-sphere>
              </a-entity>
            </a-entity>

          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- ===== 岩 ===== -->
    <a-dodecahedron position="-1.0 0.40 -6.0" radius="1" scale="1.4 0.9 1.3" rotation="0 114 0" color="#80807B"></a-dodecahedron>
    <a-dodecahedron position="4.8 0.40 -5.2" radius="1" scale="1.4 0.9 1.4" rotation="0 300 0" color="#80807B"></a-dodecahedron>
    <a-dodecahedron position="6.4 0.34 -1.2" radius="1" scale="1.5 0.8 1.5" rotation="0 182 0" color="#80807B"></a-dodecahedron>
    <a-dodecahedron position="5.9 0.33 3.4" radius="1" scale="1.4 0.7 1.1" rotation="0 149 0" color="#6E6E6A"></a-dodecahedron>
    <a-dodecahedron position="3.5 0.30 5.8" radius="1" scale="1.2 0.7 1.1" rotation="0 255 0" color="#8A8A85"></a-dodecahedron>
    <a-dodecahedron position="0.2 0.49 6.8" radius="1" scale="1.6 1.1 1.7" rotation="0 268 0" color="#6E6E6A"></a-dodecahedron>
    <a-dodecahedron position="-5.1 0.37 5.2" radius="1" scale="1.4 0.8 1.5" rotation="0 294 0" color="#777772"></a-dodecahedron>
    <a-dodecahedron position="-7.0 0.43 1.4" radius="1" scale="1.6 1.0 1.8" rotation="0 318 0" color="#80807B"></a-dodecahedron>
    <a-dodecahedron position="-6.6 0.40 -2.1" radius="1" scale="1.3 0.9 1.2" rotation="0 233 0" color="#80807B"></a-dodecahedron>
    <a-dodecahedron position="-3.7 0.22 -4.7" radius="1" scale="1.1 0.5 1.1" rotation="0 305 0" color="#80807B"></a-dodecahedron>

    <!-- ===== 海藻 ===== -->
    <a-entity position="3.5 0 2.9"
      animation="property: rotation; from: 0 0 -7; to: 0 0 7; dur: 2600; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.7" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.00 1.1 0.10" radius="0.07" height="2.3" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.15 0.6 -0.10" radius="0.07" height="1.2" color="#2E8B3E"></a-cylinder>
    </a-entity>

    <a-entity position="1.0 0 -4.7"
      animation="property: rotation; from: -7 0 0; to: 7 0 0; dur: 2900; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.9 0.00" radius="0.07" height="1.8" color="#3FA34D"></a-cylinder>
      <a-cylinder position="0.00 1.2 0.10" radius="0.07" height="2.4" color="#2A7F3A"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.7" color="#2A7F3A"></a-cylinder>
    </a-entity>

    <a-entity position="-2.9 0 3.5"
      animation="property: rotation; from: 0 0 -7; to: 0 0 7; dur: 3000; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.5" color="#2E8B3E"></a-cylinder>
      <a-cylinder position="0.00 1.2 0.10" radius="0.07" height="2.5" color="#2E8B3E"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.7" color="#2E8B3E"></a-cylinder>
    </a-entity>

    <a-entity position="2.8 0 -2.9"
      animation="property: rotation; from: -8 0 0; to: 8 0 0; dur: 3300; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.6" color="#2A7F3A"></a-cylinder>
      <a-cylinder position="0.00 1.2 0.10" radius="0.07" height="2.4" color="#2A7F3A"></a-cylinder>
      <a-cylinder position="0.15 0.7 -0.10" radius="0.07" height="1.3" color="#4FB35A"></a-cylinder>
    </a-entity>

    <a-entity position="-1.4 0 4.5"
      animation="property: rotation; from: 0 0 -7; to: 0 0 7; dur: 2900; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.9 0.00" radius="0.07" height="1.9" color="#36963F"></a-cylinder>
      <a-cylinder position="0.00 1.4 0.10" radius="0.07" height="2.7" color="#3FA34D"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.6" color="#36963F"></a-cylinder>
    </a-entity>

    <a-entity position="-5.0 0 -0.2"
      animation="property: rotation; from: -8 0 0; to: 8 0 0; dur: 2900; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.9 0.00" radius="0.07" height="1.8" color="#36963F"></a-cylinder>
      <a-cylinder position="0.00 1.5 0.10" radius="0.07" height="3.0" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.7" color="#2A7F3A"></a-cylinder>
    </a-entity>

    <a-entity position="0.7 0 4.2"
      animation="property: rotation; from: 0 0 -8; to: 0 0 8; dur: 3000; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.7" color="#2E8B3E"></a-cylinder>
      <a-cylinder position="0.00 1.5 0.10" radius="0.07" height="3.0" color="#2A7F3A"></a-cylinder>
      <a-cylinder position="0.15 0.7 -0.10" radius="0.07" height="1.4" color="#5BBF62"></a-cylinder>
    </a-entity>

    <a-entity position="5.0 0 1.3"
      animation="property: rotation; from: -6 0 0; to: 6 0 0; dur: 2800; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.7" color="#4FB35A"></a-cylinder>
      <a-cylinder position="0.00 1.4 0.10" radius="0.07" height="2.8" color="#2A7F3A"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.7" color="#36963F"></a-cylinder>
    </a-entity>

    <a-entity position="3.6 0 -2.3"
      animation="property: rotation; from: 0 0 -8; to: 0 0 8; dur: 2400; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 1.1 0.00" radius="0.07" height="2.1" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.00 1.3 0.10" radius="0.07" height="2.6" color="#2E8B3E"></a-cylinder>
      <a-cylinder position="0.15 0.7 -0.10" radius="0.07" height="1.4" color="#3FA34D"></a-cylinder>
    </a-entity>

    <a-entity position="1.3 0 -5.8"
      animation="property: rotation; from: -7 0 0; to: 7 0 0; dur: 3300; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.9 0.00" radius="0.07" height="1.9" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.00 1.1 0.10" radius="0.07" height="2.3" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.15 0.7 -0.10" radius="0.07" height="1.3" color="#2A7F3A"></a-cylinder>
    </a-entity>

    <a-entity position="-1.7 0 -3.7"
      animation="property: rotation; from: 0 0 -7; to: 0 0 7; dur: 3000; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.7 0.00" radius="0.07" height="1.4" color="#3FA34D"></a-cylinder>
      <a-cylinder position="0.00 1.4 0.10" radius="0.07" height="2.7" color="#4FB35A"></a-cylinder>
      <a-cylinder position="0.15 0.7 -0.10" radius="0.07" height="1.4" color="#5BBF62"></a-cylinder>
    </a-entity>

    <a-entity position="-3.8 0 2.4"
      animation="property: rotation; from: -8 0 0; to: 8 0 0; dur: 3200; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.6" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.00 1.1 0.10" radius="0.07" height="2.3" color="#36963F"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.5" color="#4FB35A"></a-cylinder>
    </a-entity>

    <a-entity position="-4.4 0 -1.9"
      animation="property: rotation; from: 0 0 -6; to: 0 0 6; dur: 2800; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 1.1 0.00" radius="0.07" height="2.1" color="#36963F"></a-cylinder>
      <a-cylinder position="0.00 1.4 0.10" radius="0.07" height="2.8" color="#4FB35A"></a-cylinder>
      <a-cylinder position="0.15 0.7 -0.10" radius="0.07" height="1.3" color="#4FB35A"></a-cylinder>
    </a-entity>

    <a-entity position="0.1 0 -4.2"
      animation="property: rotation; from: -8 0 0; to: 8 0 0; dur: 2500; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.6" color="#3FA34D"></a-cylinder>
      <a-cylinder position="0.00 1.2 0.10" radius="0.07" height="2.5" color="#36963F"></a-cylinder>
      <a-cylinder position="0.15 0.9 -0.10" radius="0.07" height="1.8" color="#2E8B3E"></a-cylinder>
    </a-entity>

    <a-entity position="-2.4 0 5.1"
      animation="property: rotation; from: 0 0 -7; to: 0 0 7; dur: 2900; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.9 0.00" radius="0.07" height="1.9" color="#5BBF62"></a-cylinder>
      <a-cylinder position="0.00 1.5 0.10" radius="0.07" height="3.0" color="#36963F"></a-cylinder>
      <a-cylinder position="0.15 0.8 -0.10" radius="0.07" height="1.5" color="#5BBF62"></a-cylinder>
    </a-entity>

    <a-entity position="-4.1 0 -0.8"
      animation="property: rotation; from: -6 0 0; to: 6 0 0; dur: 3100; dir: alternate; easing: easeInOutSine; loop: true">
      <a-cylinder position="-0.15 0.8 0.00" radius="0.07" height="1.7" color="#2E8B3E"></a-cylinder>
      <a-cylinder position="0.00 1.4 0.10" radius="0.07" height="2.7" color="#3FA34D"></a-cylinder>
      <a-cylinder position="0.15 0.6 -0.10" radius="0.07" height="1.2" color="#5BBF62"></a-cylinder>
    </a-entity>

    <!-- 視点 -->
    <a-entity camera look-controls wasd-controls position="0 1.2 0"></a-entity>
  </a-scene>
</body>
</html>
